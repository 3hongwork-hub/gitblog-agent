<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title | escape }}" />
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <span class="logo-icon">🤖</span>
        <span class="logo-text">GitBlog Agent</span>
        <span class="version-badge">v2.0</span>
      </a>
      <nav class="site-nav">
        <a class="nav-link" href="{{ '/' | relative_url }}">홈</a>
        <a class="nav-link" href="https://github.com/3hongwork-hub/gitblog-agent" target="_blank" rel="noopener">GitHub 레포지토리 ↗</a>
      </nav>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>© {{ 'now' | date: "%Y" }} <strong>GitBlog Agent</strong>. Antigravity & Gemini AI 기반 자율 작성 및 배포 블로그</p>
      <p class="footer-sub">매일 00:00 UTC에 GitHub Actions 자율 루프에 의해 자동 업데이트됩니다.</p>
    </div>
  </footer>
</body>
</html>
